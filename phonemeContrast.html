<!doctype html>
<html>
  <head>
      <meta http-equiv="content-type" content="text/html; charset=UTF-8">
      <meta http-equiv="content-type" content="text/html; charset=UTF-8">
      <meta name="robots" content="noindex, nofollow">
      <meta name="googlebot" content="noindex, nofollow">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <script type="text/javascript" src="//code.jquery.com/jquery-1.8.3.js"></script>
      <link rel="stylesheet" type="text/css" href="http://code.jquery.com/ui/1.9.2/themes/base/jquery-ui.css">
      <script type="text/javascript" src="http://code.jquery.com/ui/1.9.2/jquery-ui.js"></script>
    <title>File Upload</title>
  </head>
  <style>
    body {padding: 16px; font-family: sans-serif; font-size: 14px; color: #444}
    input {font-size: 14px; padding: 8px 12px; outline: none; border: 1px solid #ddd}
    input:focus {box-shadow: 0 1px 2px rgba(0,0,0,.15)}
    p {padding: 12px}
    button {background: #28d; padding: 9px 14px; margin-left: 8px; border: none; outline: none;
            color: #fff; font-size: 14px; border-radius: 4px; cursor: pointer;}
    button:hover {box-shadow: 0 1px 2px rgba(0,0,0,.15); opacity: 0.9;}
    button:active {background: #29f;}
    button[disabled] {opacity: 0.4; cursor: default}
    </style>
  <body>
    <script>
  function q(selector) {return document.querySelector(selector)}

  $(document).ready(function() {
    $("#jsonp2").click(function() {
      url= "/phonemeContrast"
      // url= "/vowel_stresses/"
      $.ajax({
        url: url,
        type: 'POST',
        ContentType: 'application/json',
        // data: {'data': data}
        data:  {"rID":q('#rID').value,"phonetics":q('#phonetics').value, "target":q('#target').value, "alternatives":q('#alternatives').value,"word_id":q('#word_id').value}
      }).done(function(response){
        alert("Data from Server:" + JSON.stringify(response));
      }).fail(function(jqXHR, textStatus, errorThrown){
        alert('FAILED! ERROR: ' + errorThrown);
      });
    });
  });

  </script>
    <h1>File Upload</h1>
    <form method="POST" action="/upload" enctype="multipart/form-data">
      <p><input type="file" name="file"></p>
      <p><input type="submit" value="Submit"></p>
    </form>

    <h1>Call module</h1>

    <form action=""  name="myForm">
      <label for="target">Target:</label>
      <select name="target" id="target">
        <option value="T">T</option>
        <option value="D">D</option>
        <option value="IH0 D">IH0 D</option>
        <option value="IH0">IH0</option>
        <!-- <option value="['AO0', 'OW0','AO1', 'OW1','AO2', 'OW2']">['AO0', 'OW0','AO1', 'OW1','AO2', 'OW2']</option> -->
      </select></p>
      <label for="alternatives">Alternatives:</label>
      <select name="alternatives" id="alternatives">
        <option value="['T', 'D', 'IH0 D']">['T', 'D', 'IH0 D']</option>
        <option value="['IH0', 'IY0']">['IH0', 'IY0']</option>
        <!-- <option value="['AO0', 'OW0','AO1', 'OW1','AO2', 'OW2']">['AO0', 'OW0','AO1', 'OW1','AO2', 'OW2']</option> -->
      </select>
      <p><label for="rID">rID:</label>
      <input type="text" name="rID" id="rID"></p>
      <p><label for="phonetics">phonetics:</label>
      <input type="text" id="phonetics" name="phonetics">
      <p><label for="word_id">word_id:</label>
      <input type="number" id="word_id" name="word_id" min="0" max="1000">

  </form>
  <button id="jsonp2" type="button" class="btn btn-info">Get feedback</button>

  </body>
</html>
