    body {padding: 16px; font-family: sans-serif; font-size: 14px; color: #444}
    input {font-size: 14px; padding: 8px 12px; outline: none; border: 1px solid #ddd}

    p {padding: 12px}
    button {background: #28d; padding: 9px 14px; margin-left: 8px; border: none; outline: none;

    button:active {background: #29f;}
    button[disabled] {opacity: 0.4; cursor: default}

  <body>
    <script>
  function q(selector) {return document.querySelector(selector)}

  $(document).ready(function() {
    $("#jsonp2").click(function() {
      url= "/flowspeech/"+q('#module').value
      data= {"phonetics":q('#phonetics').value, "rID":q('#rID').value}
      $.ajax({
        url: url,
        type: 'POST',
        ContentType: 'application/json',
        data:  data
      }).done(function(response){
        alert("Data from Server:" + JSON.stringify(response));
      }).fail(function(jqXHR, textStatus, errorThrown){
        alert('FAILED! ERROR: ' + errorThrown);
      });
    });
  });

    <h1>Toy example for sending a file and call a module</h1>
    <h1>File Upload</h1>
    <form method="POST" action="/upload" enctype="multipart/form-data">
      <p><input type="file" name="file"></p>
      <p><input type="submit" value="Submit"></p>
    </form>

    <h1>Call module</h1>

    <form action=""  name="myForm">
      <label for="module">Module:</label>
      <select name="module" id="module">
        <option value="sentenceStress">sentenceStress</option>
        <option value="wordStress">wordStress</option>
        <!-- <option value="iContrast">iContrast</option> -->
        <!-- <option value="audi">Audi</option> -->
      </select>
      <p><label for="rID">rID:</label>

      <p><label for="phonetics">phonetics:</label>

          <option value="AY1 W_UH1_D L_AH1_V T_UW1 G_OW1 T_UW1 AY1|ER0|L_AH0_N_D">I would love to go to ireland</option>
        </select>
