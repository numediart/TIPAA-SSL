version: "3"

name: content-tools

services:
  flaskapp:
    # this is needed to run the app on apple silicon
    platform: linux/amd64
    build: ./
    volumes:
      - ./:/home/mambauser/code
    image: flowspeech
    container_name: content-tools
    ports:
      - "8001:8001"
    init: true
    restart: on-failure
    command: ["bash", "content_tools/run_content_tools.sh"]

  nginx:
    build:
      context: ./nginx
      dockerfile: ./Dockerfile_streamlit
    environment:
      - SERVER_NAME=0.0.0.0
    restart: always
    init: true
    ports:
      - "80:80"
      - "443:443"
