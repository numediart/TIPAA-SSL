version: '3'

services:
  streamlitapp:
    build: 
      context: ./
      dockerfile: ./content_tools/Dockerfile_streamlit
    volumes:
      # Just specify a path and let the Engine create a volume
      - ./:/root
    container_name: streamlitapp
    network_mode: host
    ports:
      - "8501:8501"
    restart: on-failure

  nginx:
    build: ./nginx
    container_name: nginx
    environment:
      - SERVER_NAME=0.0.0.0
    restart: always
    network_mode: host
    ports:
      - "80:80"
      - "443:443"