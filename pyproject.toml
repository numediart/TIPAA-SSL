[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowspeech"
dynamic = ["version"]
description = "Implementation of the speech tech for Flowchase"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flowchase" },
]

[tool.hatch.build.targets.wheel]
packages = ["flowspeech"]

[tool.hatch.version]
path = "flowspeech/__about__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py310"]
line-length = 90
skip-string-normalization = true

[tool.ruff]
target-version = "py310"
line-length = 90
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
  "EM101",
  # Ignore f literals in exceptions
  "EM102",
  # Supress line-too-long warnings: trust black's judgement on this one.
  "E501",  
]
unfixable = [
]

[tool.ruff.isort]
known-first-party = ["src", "server"]

[tool.ruff.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]
