on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Cache Docker layers.
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v2

      - name: Build images
        run: |
          docker buildx create --use --driver=docker-container
          docker buildx bake \
            --set '*.cache-to=type=gha,mode=max' \
            --set '*.cache-from=type=gha' \
            --load

      - name: Start Docker Compose services
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: docker compose up -d

      - name: Check running containers
        run: docker compose ps -a

      - name: Check application logs
        if: always()
        run: docker compose logs flowspeech

      # The test suite expects models under /home/mambauser/code/hf_models.
      # The repository is mounted at that location by docker-compose.yml.
      - name: Download Hugging Face models
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: |
          docker compose exec -T flowspeech \
            /bin/bash -lc "python scripts/download_models.py"

      - name: Verify downloaded models
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: |
          docker compose exec -T flowspeech \
            /bin/bash -lc "test -d hf_models && ls -lah hf_models"

      - name: Set permissions
        run: |
          chmod 777 ./
          chown -R "$(id -u):$(id -g)" ./

      - name: Run pytest
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: |
          docker compose exec -T flowspeech /bin/bash -lc "ls -lah"
          docker compose exec -T flowspeech /bin/bash -lc "ls -lah .."
          docker compose exec -T flowspeech /bin/bash -lc "ls -lah hf_models"
          docker compose exec -T flowspeech \
            /bin/bash -lc \
            "pytest -p no:cacheprovider test_DL_api.py test_DL_modules.py test_models.py"

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down
