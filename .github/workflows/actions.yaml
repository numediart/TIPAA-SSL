name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest successful XLS-R ONNX artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-model.yaml
          workflow_conclusion: success
          branch: main
          name: last-hidden-state-quantized-onnx
          path: hf_models
          repo: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify XLS-R ONNX artifact
        run: |
          set -eux

          test -s hf_models/last_hidden_state.quant.onnx
          ls -lh hf_models/last_hidden_state.quant.onnx
          sha256sum hf_models/last_hidden_state.quant.onnx

      # Cache Docker layers.
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v2

      - name: Build images
        run: |
          docker buildx create --use --driver=docker-container
          docker buildx bake \
            --set '*.cache-to=type=gha,mode=max' \
            --set '*.cache-from=type=gha' \
            --load

      - name: Start Docker Compose services
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: docker compose up -d

      - name: Check running containers
        run: docker compose ps -a

      - name: Check application logs
        if: always()
        run: docker compose logs flowspeech

      - name: Verify model inside container
        run: |
          set -eux

          docker compose exec -T -u root flowspeech \
            bash -lc '
              test -s /home/mambauser/code/hf_models/last_hidden_state.quant.onnx
              ls -lh /home/mambauser/code/hf_models/last_hidden_state.quant.onnx
            '

      - name: Prepare model directory
        run: |
          set -eux

          docker compose exec -T -u root flowspeech \
            bash -lc '
              if id -u mambauser >/dev/null 2>&1; then
                chown -R mambauser:mambauser /home/mambauser/code/hf_models
              fi
              chmod -R u+rwX /home/mambauser/code/hf_models
            '

      - name: Run pytest
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: |
          docker compose exec -T flowspeech \
            micromamba run -n base \
            bash -lc '
              cd /home/mambauser/code

              echo "Current directory: $(pwd)"

              TESTS=$(find . -maxdepth 3 -type f \
                \( -name "test_*.py" -o -name "*_test.py" \) | sort)

              if [ -n "$TESTS" ]; then
                pytest -p no:cacheprovider $TESTS
              else
                echo "No pytest files found under /home/mambauser/code"
                exit 5
              fi
            '

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down
