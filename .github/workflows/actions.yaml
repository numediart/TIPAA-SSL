on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: docker compose up
      env:
        COMPOSE_INTERACTIVE_NO_CLI: 1
      run: docker compose up -d
    - name: Check running containers
      run: docker compose ps -a
    - name: Check logs
      run: docker compose logs flaskapp
    # - name: Download hf models
    #   run: docker compose exec flaskapp python scripts/download_models.py
    - name: Test with pytest
      env:
        COMPOSE_INTERACTIVE_NO_CLI: 1
      run: |
            docker compose exec flaskapp /bin/bash -c -i "ls"
            docker compose exec flaskapp /bin/bash -c -i "ls -lh hf_models/"
            docker compose exec flaskapp /bin/bash -c -i "sudo pytest test_DL_api.py test_DL_modules.py"
