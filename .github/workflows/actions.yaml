on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Cache Docker layers.
      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v2

      - name: Build images
        run: |
          docker buildx create --use --driver=docker-container
          docker buildx bake \
            --set '*.cache-to=type=gha,mode=max' \
            --set '*.cache-from=type=gha' \
            --load

      - name: Start Docker Compose services
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: docker compose up -d

      - name: Check running containers
        run: docker compose ps -a

      - name: Check application logs
        if: always()
        run: docker compose logs flowspeech

      # Ensure the mounted repo directory is writable before downloading models.
      - name: Prepare model directory
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: |
          docker compose exec -T -u root flowspeech \
            bash -lc '
              mkdir -p /home/mambauser/code/hf_models
              if id -u mambauser >/dev/null 2>&1; then
                chown -R mambauser:mambauser /home/mambauser/code/hf_models
              fi
              chmod -R u+rwX /home/mambauser/code/hf_models
            '

      # The test suite expects models under /home/mambauser/code/hf_models.
      # The repository is mounted at that location by docker-compose.yml.
      - name: Download Hugging Face models
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: |
          docker compose exec -T flowspeech \
            micromamba run -n base \
            python scripts/download_models.py

      - name: Verify downloaded models
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: |
          docker compose exec -T flowspeech \
            micromamba run -n base \
            bash -lc "test -d hf_models && ls -lah hf_models"

      - name: Run pytest
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: |
          docker compose exec -T flowspeech \
            micromamba run -n base \
            bash -lc '
              cd /home/mambauser/code
              echo "Current directory: $(pwd)"
              find . -maxdepth 3 -type f \( -name "test_*.py" -o -name "*_test.py" \) | sort

              TESTS=$(find . -maxdepth 3 -type f \( -name "test_*.py" -o -name "*_test.py" \) | sort)

              if [ -n "$TESTS" ]; then
                pytest -p no:cacheprovider $TESTS
              else
                echo "No pytest files found under /home/mambauser/code"
                exit 5
              fi
            '

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down
