on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    

    # https://github.com/actions/checkout/issues/834
    # https://github.com/actions/checkout/issues/165
    # https://github.com/nschloe/action-cached-lfs-checkout
    - name: Checkout code
      uses: nschloe/action-cached-lfs-checkout@main

    # - uses: actions/checkout@main
    - name: docker compose up
      env:
        COMPOSE_INTERACTIVE_NO_CLI: 1
      run: docker compose up -d
    - name: Check running containers
      run: docker compose ps -a
    - name: Check logs
      run: docker compose logs flaskapp
    # - name: Download hf models
    #   run: docker compose exec flaskapp python scripts/download_models.py
    - name: Test with pytest
      env:
        COMPOSE_INTERACTIVE_NO_CLI: 1
      run: docker compose exec flaskapp pytest test_DL_api.py test_DL_modules.py