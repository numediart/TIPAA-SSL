name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".github/workflows/build-model.yaml"
      - "docker-compose_jupyter.yml"
      - "docker-compose_streamlit.yml"
      - "jupyter_hal.yml"
      - "production.yml"
      - "notebooks/**"
      - "nginx/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".github/workflows/build-model.yaml"
      - "docker-compose_jupyter.yml"
      - "docker-compose_streamlit.yml"
      - "jupyter_hal.yml"
      - "production.yml"
      - "notebooks/**"
      - "nginx/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest successful XLS-R ONNX artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-model.yaml
          workflow_conclusion: success
          branch: main
          name: last-hidden-state-quantized-onnx
          path: hf_models
          repo: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify XLS-R ONNX artifact
        run: |
          set -eux

          test -s hf_models/last_hidden_state.quant.onnx
          ls -lh hf_models/last_hidden_state.quant.onnx
          sha256sum hf_models/last_hidden_state.quant.onnx

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v2

      - name: Build images
        run: |
          set -eux

          docker buildx create --use --driver=docker-container

          docker buildx bake \
            --set '*.cache-to=type=gha,mode=max' \
            --set '*.cache-from=type=gha' \
            --load

      # Run pytest with "docker compose run" (fresh container, no app server).
      # The tests use Flask's in-process test client, so the server is not
      # needed, and this avoids the memory/timing issues of running inside the
      # server container.
      - name: Verify Python and pytest environment
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: |
          set -eux

          docker compose run --rm -T flowspeech \
            micromamba run -n base \
            python --version

          docker compose run --rm -T flowspeech \
            micromamba run -n base \
            python -m pytest --version

      - name: Run pytest
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: |
          set -eux

          docker compose run --rm -T flowspeech \
            micromamba run -n base \
            python -m pytest \
              -p no:cacheprovider \
              tests