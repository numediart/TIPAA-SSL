name: Build XLS-R ONNX model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/onnx_utils.py"
      - "scripts/download_models.py"
      - ".github/workflows/build-model.yaml"

jobs:
  build-onnx-model:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare model directory
        run: |
          mkdir -p hf_models/facebook
          chmod -R 777 hf_models

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx create --use --driver=docker-container
          docker buildx bake \
            --set '*.cache-to=type=gha,mode=min' \
            --set '*.cache-from=type=gha' \
            --load

      - name: Download required Hugging Face models
        run: |
          git lfs install

          if [ ! -d "hf_models/facebook/wav2vec2-xlsr-53-espeak-cv-ft" ]; then
            GIT_LFS_SKIP_SMUDGE=1 git clone \
              https://huggingface.co/facebook/wav2vec2-xlsr-53-espeak-cv-ft \
              hf_models/facebook/wav2vec2-xlsr-53-espeak-cv-ft
          fi

          git -C hf_models/facebook/wav2vec2-xlsr-53-espeak-cv-ft lfs pull

      - name: Add swap space
        run: |
          set -eux

          echo "Memory before configuring swap:"
          free -h

          echo "Existing swap:"
          sudo swapon --show || true

          # Recreate the workflow swap file at 16 GB.
          # This also replaces an existing smaller /swapfile.
          if sudo swapon --show=NAME --noheadings | grep -Fxq /swapfile; then
            sudo swapoff /swapfile
          fi

          if [ -f /swapfile ]; then
            sudo rm -f /swapfile
          fi

          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          # Encourage the kernel to use swap sooner under memory pressure.
          sudo sysctl -w vm.swappiness=80

          echo "Memory and swap after configuring swap:"
          free -h
          sudo swapon --show
          cat /proc/swaps

      - name: Check memory and swap
        run: |
          set -eux

          echo "=== Host memory ==="
          free -h

          echo "=== Host swap ==="
          swapon --show
          cat /proc/swaps

          echo "=== Host cgroup memory ==="
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          cat /sys/fs/cgroup/memory.swap.max 2>/dev/null || true
          cat /sys/fs/cgroup/memory.current 2>/dev/null || true
          cat /sys/fs/cgroup/memory.events 2>/dev/null || true

      - name: Start Docker Compose service
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
        run: docker compose up -d flowspeech

      - name: Check container memory and swap
        run: |
          set -eux

          docker compose exec -T flowspeech sh -c '
            echo "=== Container memory ==="
            free -h

            echo "=== Container cgroup memory ==="
            cat /sys/fs/cgroup/memory.max 2>/dev/null || true
            cat /sys/fs/cgroup/memory.swap.max 2>/dev/null || true
            cat /sys/fs/cgroup/memory.current 2>/dev/null || true
            cat /sys/fs/cgroup/memory.events 2>/dev/null || true
          '

      - name: Export unquantized XLS-R ONNX model
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          TOKENIZERS_PARALLELISM: "false"
        run: |
          docker compose exec -u root -T flowspeech \
            micromamba run -n base \
            env \
              OMP_NUM_THREADS=1 \
              MKL_NUM_THREADS=1 \
              OPENBLAS_NUM_THREADS=1 \
              NUMEXPR_NUM_THREADS=1 \
              TOKENIZERS_PARALLELISM=false \
            python -c \
            'from scripts.onnx_utils import export_lhs_model_to_onnx; export_lhs_model_to_onnx("hf_models/facebook/wav2vec2-xlsr-53-espeak-cv-ft", "last_hidden_state.onnx")'

      - name: Check memory and swap after export
        if: always()
        run: |
          set -eux

          echo "=== Host memory after export ==="
          free -h

          echo "=== Host swap after export ==="
          swapon --show
          cat /proc/swaps

          echo "=== Host cgroup memory events ==="
          cat /sys/fs/cgroup/memory.events 2>/dev/null || true

          docker compose exec -T flowspeech sh -c '
            echo "=== Container memory after export ==="
            free -h

            echo "=== Container cgroup memory events ==="
            cat /sys/fs/cgroup/memory.events 2>/dev/null || true
          ' || true

      - name: Quantize ONNX model
        env:
          COMPOSE_INTERACTIVE_NO_CLI: 1
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          TOKENIZERS_PARALLELISM: "false"
        run: |
          docker compose exec -u root -T flowspeech \
            micromamba run -n base \
            env \
              OMP_NUM_THREADS=1 \
              MKL_NUM_THREADS=1 \
              OPENBLAS_NUM_THREADS=1 \
              NUMEXPR_NUM_THREADS=1 \
              TOKENIZERS_PARALLELISM=false \
            python -c \
            'from scripts.onnx_utils import quantize_onnx_model; quantize_onnx_model("hf_models/facebook/wav2vec2-xlsr-53-espeak-cv-ft/last_hidden_state.onnx", "hf_models/facebook/wav2vec2-xlsr-53-espeak-cv-ft/last_hidden_state.quant.onnx")'

          mv \
            hf_models/facebook/wav2vec2-xlsr-53-espeak-cv-ft/last_hidden_state.quant.onnx \
            hf_models/last_hidden_state.quant.onnx

      - name: Verify generated model exists
        run: |
          test -s hf_models/last_hidden_state.quant.onnx
          ls -lh hf_models/last_hidden_state.quant.onnx
          sha256sum hf_models/last_hidden_state.quant.onnx

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: last-hidden-state-quantized-onnx
          path: hf_models/last_hidden_state.quant.onnx
          retention-days: 90
