version: "3"

services:
  flowspeech:
    # this is needed to run the app on apple silicon
    platform: linux/amd64
    build: ./
    volumes:
      - ./:/home/mambauser/code
    image: flowspeech
    container_name: flowspeech
    init: true
    tty: true
    ports:
      - "8000:8000"

  nginx:
    build: ./nginx
    container_name: nginx
    environment:
      - SERVER_NAME=0.0.0.0
    depends_on:
      - flowspeech
    init: true
    tty: true
    ports:
      - "80:80"
      - "443:443"
