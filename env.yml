# Using an environment name other than "base" is not recommended!
# Read https://github.com/mamba-org/micromamba-docker#multiple-environments
# if you must use a different environment name.
name: base
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  # - montreal-forced-aligner>=2.2
  - cpuonly
  - pytorch
  - torchaudio
  - ffmpeg
  - pyworld
  - pip
  - pip:
    # - --extra-index-url https://download.pytorch.org/whl/cpu #https://stackoverflow.com/questions/73287475/how-to-specify-pip-extra-index-url-in-environment-yml
    # - torch
    # - torchaudio
    - matplotlib
    - librosa
    - pandas
    - textgrid
    # - openpyxl
    # - pyworld==0.3.2
    - scipy
    - pytest
    - cmudict
    - audiotsm
    - pytsmod
    - flask
    - tqdm
    - gunicorn
    - seaborn
    - ordered_set
    - g2p_en
    - pyyaml
    - speechbrain
    - transformers[torch]==4.23.0
    - newrelic
    - praatio
    - g2pM
    - num2words
    - unidecode
    # - umap-learn
    - jiwer
    - ctc_segmentation
    # - requests_toolbelt
    - linetimer
    - pydub
    - flask-smorest
    - streamlit
    - biopython
    - datasets
    - openai
    - psutil
    - optimum[onnxruntime]
    - phonemizer
    - numpy>=1.22.2 # not directly required, pinned by Snyk to avoid a vulnerability
    - tornado>=6.3.2 # not directly required, pinned by Snyk to avoid a vulnerability
    - st_pages