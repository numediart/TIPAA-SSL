# Using an environment name other than "base" is not recommended!
# Read https://github.com/mamba-org/micromamba-docker#multiple-environments
# if you must use a different environment name.
name: base
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.10
  - biopython
  - coverage
  - coveralls
  - cpuonly
  - ctc-segmentation
  - datasets
  - ffmpeg
  - flask
  - flask-smorest
  - g2p-en
  - gunicorn
  - jiwer
  - kaldi=*=*cpu*
  - librosa
  - matplotlib
  - montreal-forced-aligner ==2.2.17
  - ngram
  - numba
  - numpy
  - openai
  - onnxruntime
  - optimum[onnxruntime]
  - pandas
  - pip
  - praatio
  - psutil
  - pydub
  - pysoundfile >=0.12
  - pytest
  - pytest-cov
  - pytest-mypy
  - pytest-timeout
  - pytorch
  - pyworld
  - pyyaml
  - requests
  - scikit-learn
  - scipy
  - seaborn
  - streamlit
  - textgrid
  - torchaudio
  - transformers[torch]
  - tqdm
  - unidecode
  - pip:
      - audiotsm
      - cmudict >=1.0.16
      - linetimer
      - num2words
      - phonemizer
      - pytsmod >=0.3.8
      - speechbrain
      - st_pages
      - streamlit-audiorec
      - StrEnum # not needed in python 3.11
